<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="jarGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Glass Jar Body -->
  <g transform="translate(106, 80)">
    <!-- Jar Lid -->
    <rect x="70" y="30" width="160" height="26" rx="10" fill="#f8fafc" />
    <rect x="85" y="16" width="130" height="18" rx="6" fill="#cbd5e1" />

    <!-- Jar Rim / Neck -->
    <path d="M85 56 L85 76 L60 110 L60 330 C60 354 80 374 104 374 L196 374 C220 374 240 354 240 330 L240 110 L215 76 L215 56 Z" 
          fill="url(#jarGlow)" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Coin 1 (Gold) Inside Jar -->
    <circle cx="150" cy="285" r="48" fill="url(#gold)" stroke="#fef3c7" stroke-width="6" />
    <text x="150" y="303" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="#78350f" text-anchor="middle">$</text>

    <!-- Coin 2 (Slightly tilted) -->
    <circle cx="120" cy="225" r="38" fill="url(#gold)" stroke="#fef3c7" stroke-width="5" opacity="0.9" />
    <text x="120" y="240" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#78350f" text-anchor="middle">$</text>

    <!-- Coin 3 (Right) -->
    <circle cx="178" cy="235" r="34" fill="url(#gold)" stroke="#fef3c7" stroke-width="4" opacity="0.95" />
    <text x="178" y="248" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#78350f" text-anchor="middle">$</text>

    <!-- Sparkles on Glass -->
    <path d="M95 140 L100 170" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.6" />
    <path d="M90 200 L95 240" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.4" />
  </g>
</svg>
